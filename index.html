<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UChat</title>
<style>
:root{--hd:#008069;--bg:#efeae2;--panel:#fff;--text:#111b21;--muted:#667781;--line:#e9edef;--mine:#d9fdd3;--other:#fff;--acc:#00a884;--chip:#f0f2f5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--hd:#202c33;--bg:#0b141a;--panel:#111b21;--text:#e9edef;--muted:#8696a0;--line:#222d34;--mine:#005c4b;--other:#202c33;--acc:#00a884;--chip:#202c33;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--panel);color:var(--text);font-size:15px;line-height:1.4}
.hide{display:none!important}
#app{height:100%;max-width:640px;margin:0 auto;background:var(--panel);position:relative;overflow:hidden}
.err{color:#e5484d;font-size:13px;min-height:16px}
#auth{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.logo{width:80px;height:80px;border-radius:24px;background:var(--acc);display:grid;place-items:center;font-size:40px;margin-bottom:14px}
#auth h1{margin:0 0 6px;font-size:28px}#auth p{color:var(--muted);max-width:300px;margin:0 0 20px}
.card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
input[type=text],input:not([type]){padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--chip);color:var(--text);font:inherit;font-size:16px;outline:none}
.btn{border:0;border-radius:12px;padding:13px;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.btn.s{padding:8px 14px;font-size:14px;border-radius:999px}
#main{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;background:var(--hd);color:#fff;min-height:58px}
header b{font-size:19px;flex:1}
.ib{border:0;background:none;color:inherit;font-size:22px;cursor:pointer;padding:6px 8px;border-radius:50%;line-height:1}
#body{flex:1;min-height:0;position:relative}
.v{position:absolute;inset:0;overflow-y:auto}
nav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:9px 0 7px;font:inherit;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:21px}
nav button.on{color:var(--acc);font-weight:700}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:0 0 auto;overflow:hidden;text-transform:uppercase}
.av img{width:100%;height:100%;object-fit:cover}
.li{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.li .t{flex:1;min-width:0}.li .t b{display:block}.li .t small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{padding:14px 16px 6px;font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.5px}
.ring{padding:3px;border-radius:50%;background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf);flex:0 0 auto;display:grid}
.ring .av{border:2px solid var(--panel)}
.pad{padding:16px}
.fs{display:flex;gap:8px;padding:12px 16px}.fs input{flex:1;min-width:0}
#vconv{display:flex;flex-direction:column;background-color:var(--bg);background-image:radial-gradient(rgba(128,128,128,.12) 1px,transparent 1px);background-size:18px 18px}
#msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;font-size:11px;background:var(--chip);color:var(--muted);padding:3px 10px;border-radius:8px;margin:6px 0}
.r{display:flex;align-items:flex-end;gap:6px;max-width:84%}
.r.me{align-self:flex-end;flex-direction:row-reverse}
.r.gap{margin-top:8px}.r .sp{width:28px;flex:0 0 auto}
.bub{padding:6px 9px 5px;border-radius:10px;background:var(--other);box-shadow:0 1px 1px rgba(0,0,0,.13);overflow-wrap:anywhere;min-width:60px}
.r.me .bub{background:var(--mine)}
.nm{font-size:12.5px;font-weight:700;margin-bottom:1px}
.tm{font-size:10.5px;color:var(--muted);float:right;margin:5px 0 0 10px}
.mi{display:block;max-width:100%;width:250px;border-radius:8px;margin-bottom:3px;cursor:pointer}
.au{width:220px;max-width:100%;height:40px}
.loc{display:block;padding:10px;border-radius:8px;background:var(--chip);color:var(--acc);font-weight:600;text-decoration:none;margin-bottom:3px}
#rec{text-align:center;padding:6px;font-size:13px;background:#e5484d;color:#fff}
form{display:flex;gap:6px;align-items:center;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);background:var(--chip)}
form input[type=text]{flex:1;min-width:0;border-radius:999px;background:var(--panel);border:0;padding:12px 16px}
form .ib{color:var(--muted);font-size:23px}
.ib.red{color:#e5484d}
.send{width:44px;height:44px;border:0;border-radius:50%;background:var(--acc);color:#fff;font-size:18px;cursor:pointer;flex:0 0 auto}
#sv{position:absolute;inset:0;background:#000;z-index:20;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
#sv img,#sv video{max-width:100%;max-height:100%}
#sv .tx{font-size:26px;font-weight:700;text-align:center;padding:30px;width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#6a5cff,#d62976)}
#sv .meta{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;display:flex;gap:8px;align-items:center;text-shadow:0 1px 3px #000}
#boot{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--panel);color:var(--muted);padding:24px;text-align:center}
#toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="boot">Memuat UChat…</div>
  <section id="auth" class="hide">
    <div class="logo">💬</div><h1>UChat</h1>
    <p>Buat akunmu. Username bersifat unik dan tidak akan berubah kecuali kamu sendiri yang menggantinya.</p>
    <div class="card">
      <input id="un" maxlength="20" placeholder="Username (huruf kecil, angka, _)" autocapitalize="none" autocomplete="off">
      <input id="dn" maxlength="20" placeholder="Nama tampilan" autocomplete="off">
      <button class="btn" id="go">Mulai</button>
      <div id="aerr" class="err"></div>
    </div>
  </section>

  <section id="main" class="hide">
    <header><button class="ib hide" id="bk">←</button><div id="hav" class="hide"></div><b id="ttl">UChat</b></header>
    <div id="body">
      <div id="vchats" class="v"></div>
      <div id="vstatus" class="v hide"></div>
      <div id="vfriends" class="v hide"></div>
      <div id="vme" class="v hide"></div>
      <div id="vconv" class="v hide">
        <div id="msgs"></div>
        <div id="rec" class="hide">🔴 Merekam… tekan 🎤 lagi untuk mengirim</div>
        <form id="f">
          <label class="ib" for="fi">📎</label><input id="fi" type="file" accept="image/*,video/*" hidden>
          <button type="button" class="ib" id="loc">📍</button>
          <input id="txt" type="text" maxlength="500" placeholder="Ketik pesan…" autocomplete="off">
          <button type="button" class="ib" id="mic">🎤</button>
          <button class="send" type="submit">➤</button>
        </form>
      </div>
    </div>
    <nav id="nav">
      <button data-t="chats" class="on"><span>💬</span>Chat</button>
      <button data-t="status"><span>◎</span>Status</button>
      <button data-t="friends"><span>👥</span>Teman</button>
      <button data-t="me"><span>👤</span>Profil</button>
    </nav>
  </section>
  <div id="sv" class="hide"></div>
  <div id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== Supabase (jangan diganti) =====
var SUPABASE_URL = "https://aqurgyiimjgyqxoqnhto.supabase.co";
var SUPABASE_KEY = "sb_publishable_XLGOqtX1F7ZoD6AYEebvXg_8KGLegIO";
// =====================================

function showErr(m){var b=document.getElementById("boot");b.classList.remove("hide");b.textContent="";var t=document.createElement("div");t.textContent=m;var x=document.createElement("button");x.className="btn s";x.textContent="Muat ulang";x.onclick=function(){location.reload()};b.appendChild(t);b.appendChild(x)}
window.addEventListener("error",function(e){showErr("Terjadi error: "+e.message)});

function startApp(){
var ROOMS=[["Umum","🏫"],["Kalkulus","📐"],["Pemrograman","💻"],["Fisika","⚛️"],["Bahasa Inggris","🇬🇧"],["Curhat","🫶"]];
var COLORS=["#6a5cff","#ff6b8b","#18b57e","#f59e0b","#0ea5e9","#a855f7","#ef4444","#14b8a6"];
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var me=null,prof=null,P={},F=[],cur=null,msgs=[],tab="chats",mr=null,chunks=[],TT=null,ST=null;
var $=function(i){return document.getElementById(i)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function color(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return COLORS[h%COLORS.length]}
function av(p,sz){sz=sz||44;var d=el("div","av");d.style.width=d.style.height=sz+"px";d.style.fontSize=(sz*.42)+"px";var n=(p&&(p.display_name||p.username||p.name))||"?";
  if(p&&p.avatar_url){var i=document.createElement("img");i.src=p.avatar_url;d.appendChild(i)}else{d.style.background=color(n);d.textContent=n.charAt(0)}return d}
function toast(t){var x=$("toast");x.textContent=t;x.classList.add("on");clearTimeout(TT);TT=setTimeout(function(){x.classList.remove("on")},3200)}
function hm(ts){return new Date(ts).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}
function dl(ts){var d=new Date(ts);return d.toDateString()===new Date().toDateString()?"Hari ini":d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"})}
function pn(id){var p=P[id];return p?(p.display_name||p.username):"Pengguna"}
function dm(o){return "dm:"+[me.id,o].sort().join("_")}
function li(a,t,s,fn){var r=el("div","li");r.appendChild(a);var x=el("div","t");x.appendChild(el("b","",t));if(s)x.appendChild(el("small","",s));r.appendChild(x);if(fn)r.onclick=fn;return r}

/* ---------- AUTH ---------- */
$("go").onclick=async function(){
  var u=$("un").value.trim().toLowerCase(),d=$("dn").value.trim()||u,er=$("aerr");er.textContent="";
  if(!/^[a-z0-9_]{3,20}$/.test(u)){er.textContent="Username 3–20 karakter: huruf kecil, angka, atau _";return}
  if(!me){var a=await sb.auth.signInAnonymously();if(a.error){er.textContent="Gagal masuk: "+a.error.message;return}me=a.data.user}
  var r=await sb.from("profiles").insert({id:me.id,username:u,display_name:d}).select().single();
  if(r.error){er.textContent=r.error.code==="23505"?"Username sudah dipakai, coba yang lain":r.error.message;return}
  prof=r.data;enter();
};
(async function(){
  try{var s=await sb.auth.getSession();
    if(s.data.session){me=s.data.session.user;var r=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();if(r.data){prof=r.data;await enter();return}}
  }catch(e){showErr("Gagal memuat: "+e.message);return}
  $("boot").classList.add("hide");$("auth").classList.remove("hide");
})();

async function loadP(){var r=await sb.from("profiles").select("*");P={};(r.data||[]).forEach(function(p){P[p.id]=p})}
async function loadF(){var r=await sb.from("friends").select("*");F=r.data||[]}
function friends(){return F.filter(function(f){return f.status==="accepted"}).map(function(f){return f.a===me.id?f.b:f.a})}

async function enter(){
  $("boot").classList.add("hide");$("auth").classList.add("hide");$("main").classList.remove("hide");
  await Promise.all([loadP(),loadF()]);P[me.id]=prof;
  sb.channel("rt").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},function(p){
    var m=p.new;if(m.room===cur&&!msgs.some(function(x){return x.id===m.id})){msgs.push(m);drawMsgs()}
  }).subscribe();
  setInterval(async function(){if(tab==="chats"&&!cur){await loadF();drawChats()}if(tab==="friends"){await loadF();drawFList()}},12000);
  go("chats");
}

/* ---------- NAV ---------- */
var TITLES={chats:"UChat",status:"Status",friends:"Teman",me:"Profil"};
function go(t){
  tab=t;cur=null;
  ["chats","status","friends","me","conv"].forEach(function(k){$("v"+k).classList.toggle("hide",k!==t)});
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)});
  $("nav").classList.remove("hide");$("bk").classList.add("hide");$("hav").classList.add("hide");$("ttl").textContent=TITLES[t];
  if(t==="chats")drawChats();if(t==="status")drawStatus();if(t==="friends")drawFriends();if(t==="me")drawMe();
}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){go(b.dataset.t)}});
$("bk").onclick=function(){go("chats")};

/* ---------- CHATS ---------- */
function drawChats(){
  var v=$("vchats");v.innerHTML="";v.appendChild(el("div","sec","Grup kampus"));
  ROOMS.forEach(function(r){var a=el("div","av",r[1]);a.style.cssText="width:46px;height:46px;font-size:22px;background:var(--chip)";
    v.appendChild(li(a,r[0],"Grup terbuka untuk semua",function(){openConv(r[0],r[0],a.cloneNode(true))}))});
  var fr=friends();v.appendChild(el("div","sec","Chat pribadi"));
  if(!fr.length){v.appendChild(el("div","pad",'Belum ada teman. Buka tab Teman untuk menambah lewat username.')).style.color="var(--muted)"}
  fr.forEach(function(id){v.appendChild(li(av(P[id],46),pn(id),"@"+((P[id]||{}).username||""),function(){openConv(dm(id),pn(id),av(P[id],36))}))});
}
async function openConv(room,title,avEl){
  cur=room;msgs=[];
  ["chats","status","friends","me"].forEach(function(k){$("v"+k).classList.add("hide")});
  $("vconv").classList.remove("hide");$("nav").classList.add("hide");$("bk").classList.remove("hide");
  var h=$("hav");h.innerHTML="";h.appendChild(avEl);h.classList.remove("hide");$("ttl").textContent=title;
  $("msgs").innerHTML="";
  var r=await sb.from("messages").select("*").eq("room",room).order("created_at",{ascending:false}).limit(120);
  if(r.error){toast("Gagal memuat: "+r.error.message);return}
  if(cur!==room)return;msgs=r.data.reverse();drawMsgs();
}
function body(m){
  var k=m.kind||"text",w=el("div");
  if(k==="image"){var i=document.createElement("img");i.src=m.url;i.className="mi";i.onclick=function(){window.open(m.url,"_blank")};w.appendChild(i)}
  else if(k==="video"){var v=document.createElement("video");v.src=m.url;v.controls=true;v.preload="metadata";v.className="mi";w.appendChild(v)}
  else if(k==="audio"){var a=document.createElement("audio");a.src=m.url;a.controls=true;a.className="au";w.appendChild(a)}
  else if(k==="location"){var l=el("a","loc","📍 Lokasi dibagikan · Buka di peta");l.href="https://www.openstreetmap.org/?mlat="+m.lat+"&mlon="+m.lng+"#map=16/"+m.lat+"/"+m.lng;l.target="_blank";l.rel="noopener";w.appendChild(l)}
  if(m.text)w.appendChild(el("span","",m.text));
  return w;
}
function drawMsgs(){
  var box=$("msgs");box.innerHTML="";var isdm=cur&&cur.indexOf("dm:")===0;
  if(!msgs.length){var e=el("div","day","Belum ada pesan. Sapa duluan! 👋");e.style.margin="auto";box.appendChild(e);return}
  var ld="",lu="",lt=0;
  msgs.forEach(function(m){
    var t=new Date(m.created_at).getTime(),d=dl(t);
    if(d!==ld){box.appendChild(el("div","day",d));ld=d;lu=""}
    var mine=m.uid===me.id,gr=(m.uid===lu&&t-lt<300000);
    var r=el("div","r"+(mine?" me":"")+(gr?"":" gap"));
    if(!mine&&!isdm){r.appendChild(gr?el("div","sp"):av(P[m.uid]||{name:m.name},28))}
    var b=el("div","bub");
    if(!mine&&!isdm&&!gr){var n=el("div","nm",P[m.uid]?pn(m.uid):m.name);n.style.color=color(m.name);b.appendChild(n)}
    b.appendChild(body(m));b.appendChild(el("span","tm",hm(t)));r.appendChild(b);box.appendChild(r);lu=m.uid;lt=t;
  });
  box.scrollTop=box.scrollHeight;
}
async function send(o){
  if(!cur)return false;
  var m=Object.assign({room:cur,name:prof.display_name||prof.username,uid:me.id,text:""},o);
  var r=await sb.from("messages").insert(m).select().single();
  if(r.error){toast("Gagal kirim: "+r.error.message);return false}
  if(!msgs.some(function(x){return x.id===r.data.id})){msgs.push(r.data);drawMsgs()}
  return true;
}
async function up(file){
  var ext=(file.name.split(".").pop()||"bin").toLowerCase();
  var path=me.id+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,7)+"."+ext;
  var r=await sb.storage.from("media").upload(path,file,{contentType:file.type});
  if(r.error){toast("Unggah gagal: "+r.error.message);return null}
  return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
}
$("f").onsubmit=function(e){e.preventDefault();var v=$("txt").value.trim();if(!v)return;$("txt").value="";send({text:v})};
$("fi").onchange=async function(){
  var f=this.files[0];this.value="";if(!f)return;
  if(f.size>40*1048576){toast("File maksimal 40 MB");return}
  toast("Mengunggah…");var u=await up(f);if(u)send({kind:f.type.indexOf("video")===0?"video":"image",url:u});
};
$("loc").onclick=function(){
  if(!navigator.geolocation){toast("Lokasi tidak didukung di perangkat ini");return}
  toast("Mengambil lokasi…");
  navigator.geolocation.getCurrentPosition(function(p){send({kind:"location",lat:p.coords.latitude,lng:p.coords.longitude})},function(){toast("Izin lokasi ditolak")},{enableHighAccuracy:true,timeout:15000});
};
$("mic").onclick=async function(){
  if(mr&&mr.state==="recording"){mr.stop();return}
  var st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast("Izin mikrofon ditolak");return}
  chunks=[];mr=new MediaRecorder(st);
  mr.ondataavailable=function(e){chunks.push(e.data)};
  mr.onstop=async function(){
    st.getTracks().forEach(function(t){t.stop()});$("rec").classList.add("hide");$("mic").classList.remove("red");
    var type=(mr.mimeType||"audio/webm").split(";")[0],blob=new Blob(chunks,{type:type});
    if(blob.size<1000)return;toast("Mengirim voice note…");
    var u=await up(new File([blob],"vn."+(type.indexOf("mp4")>-1?"m4a":"webm"),{type:type}));if(u)send({kind:"audio",url:u});
  };
  mr.start();$("rec").classList.remove("hide");$("mic").classList.add("red");
};

/* ---------- STATUS ---------- */
async function drawStatus(){
  var v=$("vstatus");v.innerHTML="";
  var r=await sb.from("statuses").select("*").gt("created_at",new Date(Date.now()-864e5).toISOString()).order("created_at",{ascending:true});
  if(tab!=="status")return;
  var by={};(r.data||[]).forEach(function(s){(by[s.uid]=by[s.uid]||[]).push(s)});
  var mine=by[me.id]||[];
  var row=li(av(prof,52),"Status saya",mine.length?mine.length+" status · ketuk untuk melihat":"Bagikan foto, video, atau teks (hilang 24 jam)",mine.length?function(){showS(mine,me.id)}:null);
  v.appendChild(row);
  var bar=el("div","fs");
  var lb=el("label","btn s","📷 Foto/Video");lb.htmlFor="sfi";lb.style.textAlign="center";
  var tb=el("button","btn s","✏️ Teks");tb.onclick=async function(){
    var t=prompt("Tulis statusmu:");if(!t||!t.trim())return;
    var x=await sb.from("statuses").insert({uid:me.id,kind:"text",text:t.trim().slice(0,200)});
    if(x.error)toast(x.error.message);else{toast("Status dibagikan");drawStatus()}};
  bar.appendChild(lb);bar.appendChild(tb);v.appendChild(bar);
  var fi=document.createElement("input");fi.type="file";fi.id="sfi";fi.accept="image/*,video/*";fi.hidden=true;
  fi.onchange=async function(){var f=fi.files[0];if(!f)return;if(f.size>40*1048576){toast("File maksimal 40 MB");return}
    toast("Mengunggah…");var u=await up(f);if(!u)return;
    var x=await sb.from("statuses").insert({uid:me.id,kind:f.type.indexOf("video")===0?"video":"image",url:u});
    if(x.error)toast(x.error.message);else{toast("Status dibagikan");drawStatus()}};
  v.appendChild(fi);
  v.appendChild(el("div","sec","Status teman"));
  var ids=Object.keys(by).filter(function(id){return id!==me.id});
  if(!ids.length)v.appendChild(el("div","pad","Belum ada status dari temanmu.")).style.color="var(--muted)";
  ids.forEach(function(id){var list=by[id],a=el("div","ring");a.appendChild(av(P[id],48));
    v.appendChild(li(a,pn(id),list.length+" status · "+hm(list[list.length-1].created_at),function(){showS(list,id)}))});
}
function showS(list,uid){
  var sv=$("sv"),i=0,tm=null;sv.classList.remove("hide");
  function end(){clearTimeout(tm);sv.classList.add("hide");sv.innerHTML=""}
  function step(){
    clearTimeout(tm);if(i>=list.length){end();return}
    var s=list[i++];sv.innerHTML="";
    if(s.kind==="image"){var im=document.createElement("img");im.src=s.url;sv.appendChild(im);tm=setTimeout(step,5000)}
    else if(s.kind==="video"){var vd=document.createElement("video");vd.src=s.url;vd.autoplay=true;vd.playsInline=true;vd.onended=step;sv.appendChild(vd)}
    else{sv.appendChild(el("div","tx",s.text));tm=setTimeout(step,5000)}
    var m=el("div","meta");m.appendChild(av(P[uid],34));m.appendChild(el("span","",pn(uid)+" · "+hm(s.created_at)));sv.appendChild(m);
  }
  sv.onclick=step;step();
}

/* ---------- TEMAN ---------- */
function drawFriends(){
  var v=$("vfriends");v.innerHTML="";
  var bar=el("div","fs");var q=document.createElement("input");q.id="fq";q.placeholder="Cari username teman";q.autocapitalize="none";
  var b=el("button","btn s","Tambah");b.onclick=addF;bar.appendChild(q);bar.appendChild(b);v.appendChild(bar);
  var l=el("div");l.id="flist";v.appendChild(l);drawFList();
}
function drawFList(){
  var l=$("flist");if(!l)return;l.innerHTML="";
  var inc=F.filter(function(f){return f.status==="pending"&&f.b===me.id});
  if(inc.length){l.appendChild(el("div","sec","Permintaan masuk"));
    inc.forEach(function(f){var r=li(av(P[f.a],44),pn(f.a),"@"+((P[f.a]||{}).username||""));
      var ok=el("button","btn s","Terima");ok.onclick=async function(){await sb.from("friends").update({status:"accepted"}).eq("id",f.id);await loadF();drawFList()};
      var no=el("button","ib","✖");no.onclick=async function(){await sb.from("friends").delete().eq("id",f.id);await loadF();drawFList()};
      r.appendChild(ok);r.appendChild(no);l.appendChild(r)})}
  var fr=friends();l.appendChild(el("div","sec","Teman ("+fr.length+")"));
  fr.forEach(function(id){l.appendChild(li(av(P[id],44),pn(id),"@"+((P[id]||{}).username||""),function(){openConv(dm(id),pn(id),av(P[id],36))}))});
  var sent=F.filter(function(f){return f.status==="pending"&&f.a===me.id});
  if(sent.length){l.appendChild(el("div","sec","Menunggu persetujuan"));
    sent.forEach(function(f){l.appendChild(li(av(P[f.b],44),pn(f.b),"@"+((P[f.b]||{}).username||"")))})}
}
async function addF(){
  var u=$("fq").value.trim().toLowerCase().replace(/^@/,"");if(!u)return;
  var r=await sb.from("profiles").select("*").eq("username",u).maybeSingle();
  if(!r.data){toast("Username tidak ditemukan");return}
  var t=r.data;if(t.id===me.id){toast("Itu usernamemu sendiri 🙂");return}
  if(F.some(function(f){return f.a===t.id||f.b===t.id})){toast("Sudah ada permintaan atau pertemanan");return}
  P[t.id]=t;var x=await sb.from("friends").insert({a:me.id,b:t.id});
  if(x.error){toast(x.error.message);return}
  $("fq").value="";toast("Permintaan dikirim");await loadF();drawFList();
}

/* ---------- PROFIL ---------- */
function drawMe(){
  var v=$("vme");v.innerHTML="";var w=el("div","pad");w.style.cssText="display:flex;flex-direction:column;gap:10px;align-items:center";
  var a=av(prof,110);a.style.cursor="pointer";a.onclick=function(){$("pfi").click()};w.appendChild(a);
  w.appendChild(el("small","","Ketuk foto untuk mengganti")).style.color="var(--muted)";
  var pf=document.createElement("input");pf.type="file";pf.id="pfi";pf.accept="image/*";pf.hidden=true;
  pf.onchange=async function(){var f=pf.files[0];if(!f)return;toast("Mengunggah…");var u=await up(f);if(!u)return;
    var r=await sb.from("profiles").update({avatar_url:u}).eq("id",me.id).select().single();
    if(r.error){toast(r.error.message);return}prof=r.data;P[me.id]=prof;toast("Foto profil diperbarui");drawMe()};
  w.appendChild(pf);
  var dn=document.createElement("input");dn.value=prof.display_name||"";dn.maxLength=20;dn.placeholder="Nama tampilan";dn.style.width="100%";
  var s1=el("button","btn s","Simpan nama");s1.onclick=async function(){
    var r=await sb.from("profiles").update({display_name:dn.value.trim()||prof.username}).eq("id",me.id).select().single();
    if(r.error){toast(r.error.message);return}prof=r.data;P[me.id]=prof;toast("Nama disimpan")};
  var un=document.createElement("input");un.value=prof.username;un.maxLength=20;un.autocapitalize="none";un.style.width="100%";
  var s2=el("button","btn s","Ganti username");s2.onclick=async function(){
    var u=un.value.trim().toLowerCase();if(!/^[a-z0-9_]{3,20}$/.test(u)){toast("Username 3–20 karakter: huruf kecil, angka, _");return}
    if(u===prof.username)return;if(!confirm("Ganti username menjadi @"+u+"?"))return;
    var r=await sb.from("profiles").update({username:u}).eq("id",me.id).select().single();
    if(r.error){toast(r.error.code==="23505"?"Username sudah dipakai":r.error.message);return}prof=r.data;P[me.id]=prof;toast("Username diganti")};
  [dn,s1,un,s2].forEach(function(x){w.appendChild(x)});
  w.appendChild(el("small","","Akunmu tersimpan di browser ini. Jangan hapus data situs agar akun tidak hilang.")).style.cssText="color:var(--muted);text-align:center";
  v.appendChild(w);
}
}
function launch(){try{startApp()}catch(e){showErr("Gagal memulai: "+e.message)}}
if(window.supabase)launch();else{var sc=document.createElement("script");sc.src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";sc.onload=launch;sc.onerror=function(){showErr("Pustaka Supabase gagal dimuat. Cek internet atau matikan adblock, lalu muat ulang.")};document.head.appendChild(sc)}
</script>
